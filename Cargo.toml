[workspace]
resolver = "2"
members = ["crates/apiary-core", "crates/apiary-runtime", "crates/apiary-cli", "crates/apiary-hostd", "crates/apiary-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/farspeak-labs/apiary"

[workspace.dependencies]
# nip46 is required alongside nip49 in nostr 0.45.1 (upstream feature-gate bug:
# Error::crypto_display [nip49] calls Error::crypto [nip46|nip59]) — and we want
# NIP-46 anyway for the remote-signer custody path (SPEC §3).
nostr = { version = "0.45", features = ["nip44", "nip46", "nip49", "os-rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
zeroize = "1"
