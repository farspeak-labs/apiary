[package]
name = "apiary-runtime"
description = "Apiary agent runtime: inference providers, routing, spend authority, run loop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apiary-core = { path = "../apiary-core" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
thiserror.workspace = true
zeroize.workspace = true
fs2 = "0.4"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
html2text = "0.17.1"
nostr.workspace = true
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
wait-timeout = "0.2"
